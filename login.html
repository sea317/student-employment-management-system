<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>就业管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 400px;
            padding: 40px;
        }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error { color: red; text-align: center; margin-top: 10px; font-size: 14px; }
        .info { text-align: center; margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>就业管理系统</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>用户名/学号</label>
                <input type="text" id="username" required placeholder="请输入用户名">
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" id="password" required placeholder="请输入密码">
            </div>
            <div class="input-group">
                <label>角色</label>
                <select id="role">
                    <option value="graduate">毕业生</option>
                    <option value="employer">招聘单位</option>
                    <option value="admin">管理员</option>
                </select>
            </div>
            <button type="submit">登录</button>
            <div class="error" id="errorMsg"></div>
            <div class="info">
                测试账号：毕业生 20240001（密码任意）<br>
                用人单位 huawei（密码任意）<br>
                管理员 admin（密码任意）
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '登录中...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                
                const result = await response.json();
                console.log('结果:', result);
                
                if (result.code === 200) {
                    errorMsg.style.color = 'green';
                    errorMsg.textContent = '登录成功！正在跳转...';
                    
                    if (role === 'graduate') {
                        window.location.href = '/graduate.html';
                    } else if (role === 'employer') {
                        window.location.href = '/employer.html';
                    } else if (role === 'admin') {
                        window.location.href = '/admin.html';
                    }
                } else {
                    errorMsg.style.color = 'red';
                    errorMsg.textContent = result.message || '登录失败';
                }
            } catch (error) {
                errorMsg.style.color = 'red';
                errorMsg.textContent = '网络错误：' + error.message;
            }
        });
    </script>
</body>
</html>
