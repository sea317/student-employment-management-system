<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用人单位工作台 - 就业管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
        .nav a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .nav a:hover, .nav a.active { background: rgba(255,255,255,0.2); }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-small { padding: 5px 12px; font-size: 12px; }
        .btn-danger { background: #e74c3c; }
        .btn-success { background: #27ae60; }
        .btn-warning { background: #f39c12; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #666; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .job-item, .app-item, .fair-item, .booth-item {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        .booth-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .booth {
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
        .booth.available { background: #e8f5e9; color: #2e7d32; }
        .booth.occupied { background: #ffebee; color: #c62828; cursor: not-allowed; }
        .booth.selected { background: #667eea; color: white; border: none; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-select { padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>就业管理系统 - 用人单位</h2>
        <div class="nav">
            <a class="active" data-page="jobs">我的招聘</a>
            <a data-page="addJob">发布招聘</a>
            <a data-page="applications">收到的简历</a>
            <a data-page="fairs">招聘会报名</a>
            <a data-page="stats">数据统计</a>
            <a data-page="myFairs">我的报名</a>
            <a id="logoutBtn">退出</a>
        </div>
    </div>
    
    <div class="container">
        <!-- 我的招聘 -->
        <div id="jobsPage">
            <div class="card">
                <h3>我发布的招聘信息</h3>
                <div id="myJobList"></div>
            </div>
        </div>
        
        <!-- 发布招聘 -->
        <div id="addJobPage" style="display:none;">
            <div class="card">
                <h3>发布新招聘</h3>
                <form id="addJobForm">
                    <div class="form-row">
                        <div class="form-group"><label>招聘专业</label><input type="text" id="major_needed" required></div>
                        <div class="form-group"><label>学历要求</label><input type="text" id="edu_required" placeholder="本科/硕士等"></div>
                        <div class="form-group"><label>需求人数</label><input type="number" id="demand_num" required></div>
                        <div class="form-group"><label>招聘方式</label>
                            <select id="recruit_method"><option>现场</option><option>委托</option></select>
                        </div>
                    </div>
                    <div class="form-group"><label>岗位描述</label><textarea id="job_description" rows="4" required></textarea></div>
                    <button type="submit" class="btn">发布招聘</button>
                </form>
            </div>
        </div>
        
        <!-- 收到的简历 -->
        <div id="applicationsPage" style="display:none;">
            <div class="card">
                <h3>收到的简历</h3>
                <div id="receivedApps"></div>
            </div>
        </div>
        
        <!-- 招聘会报名 -->
        <div id="fairsPage" style="display:none;">
            <div class="card">
                <h3>可报名的招聘会</h3>
                <div id="fairList"></div>
            </div>
            <div class="card" id="boothSelection" style="display:none;">
                <h3 id="selectedFairTitle">选择摊位</h3>
                <p>请点击空闲摊位进行报名</p>
                <div id="boothGrid" class="booth-grid"></div>
                <button class="btn" id="cancelBoothBtn" style="margin-top:15px;">取消</button>
            </div>
        </div>
        
        <!-- 数据统计 -->
        <div id="statsPage" style="display:none;">
            <div class="card">
                <h3>招聘数据统计</h3>
                <div class="stats-grid" id="statsGrid"></div>
            </div>
        </div>
        
        <!-- 我的报名 -->
        <div id="myFairsPage" style="display:none;">
            <div class="card">
                <h3>我已报名的招聘会</h3>
                <div id="myFairsList"></div>
            </div>
        </div>
    </div>

    <script>
        let currentFairId = null;
        
        // 获取当前用户
        async function getCurrentUser() {
            const res = await fetch('/api/current_user');
            const data = await res.json();
            if (data.code !== 200) {
                window.location.href = '/login.html';
            }
            return data.data;
        }
        
        // 页面切换
        document.querySelectorAll('.nav a[data-page]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.dataset.page;
                document.getElementById('jobsPage').style.display = page === 'jobs' ? 'block' : 'none';
                document.getElementById('addJobPage').style.display = page === 'addJob' ? 'block' : 'none';
                document.getElementById('applicationsPage').style.display = page === 'applications' ? 'block' : 'none';
                document.getElementById('fairsPage').style.display = page === 'fairs' ? 'block' : 'none';
                document.getElementById('statsPage').style.display = page === 'stats' ? 'block' : 'none';
                document.getElementById('myFairsPage').style.display = page === 'myFairs' ? 'block' : 'none';
                document.getElementById('boothSelection').style.display = 'none';
                
                document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
                
                if (page === 'jobs') loadMyJobs();
                if (page === 'applications') loadReceivedApps();
                if (page === 'fairs') loadFairs();
                if (page === 'stats') loadStats();
                if (page === 'myFairs') loadMyFairs();
            });
        });
        
        // 我的招聘
        async function loadMyJobs() {
            const res = await fetch('/api/employer/recruitments');
            const result = await res.json();
            if (result.code === 200 && result.data) {
                const container = document.getElementById('myJobList');
                if (result.data.length === 0) {
                    container.innerHTML = '<p>暂无招聘信息，点击上方"发布招聘"开始</p>';
                    return;
                }
                container.innerHTML = result.data.map(job => `
                    <div class="job-item">
                        <div>
                            <h4>${job.major_needed}</h4>
                            <p>学历：${job.edu_required} | 需求人数：${job.demand_num} | 招聘方式：${job.recruit_method} | 发布日期：${job.publish_date}</p>
                            <p>${job.job_description}</p>
                        </div>
                        <button class="btn btn-small btn-danger" onclick="deleteJob(${job.rec_id})">删除</button>
                    </div>
                `).join('');
            }
        }
        
        async function deleteJob(recId) {
            if (confirm('确定要删除这条招聘信息吗？')) {
                const res = await fetch(`/api/employer/recruitment/${recId}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadMyJobs();
            }
        }
        
        document.getElementById('addJobForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                major_needed: document.getElementById('major_needed').value,
                edu_required: document.getElementById('edu_required').value,
                demand_num: document.getElementById('demand_num').value,
                recruit_method: document.getElementById('recruit_method').value,
                job_description: document.getElementById('job_description').value
            };
            const res = await fetch('/api/employer/recruitments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const result = await res.json();
            alert(result.message);
            if (result.code === 200) {
                document.getElementById('addJobForm').reset();
                document.querySelector('.nav a[data-page="jobs"]').click();
            }
        });
        
        // 收到的简历
        async function loadReceivedApps() {
            const res = await fetch('/api/employer/applications');
            const result = await res.json();
            if (result.code === 200 && result.data) {
                const container = document.getElementById('receivedApps');
                if (result.data.length === 0) {
                    container.innerHTML = '<p>暂无收到的简历</p>';
                    return;
                }
                container.innerHTML = result.data.map(app => `
                    <div class="app-item">
                        <div style="flex:1;">
                            <h4>${app.name} - ${app.major_needed}</h4>
                            <p>专业：${app.major} | 学历：${app.education} | 电话：${app.phone}</p>
                            <p>投递时间：${app.apply_time}</p>
                        </div>
                        <div>
                            <select class="status-select" data-app-id="${app.app_id}" onchange="updateStatus(${app.app_id}, this.value)">
                                <option value="已投递" ${app.status === '已投递' ? 'selected' : ''}>已投递</option>
                                <option value="待查看" ${app.status === '待查看' ? 'selected' : ''}>待查看</option>
                                <option value="面试" ${app.status === '面试' ? 'selected' : ''}>面试</option>
                                <option value="录用" ${app.status === '录用' ? 'selected' : ''}>录用</option>
                                <option value="不合适" ${app.status === '不合适' ? 'selected' : ''}>不合适</option>
                            </select>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        async function updateStatus(appId, status) {
            const res = await fetch(`/api/employer/application/${appId}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const result = await res.json();
            alert(result.message);
        }
        
        // 招聘会列表
        async function loadFairs() {
            const res = await fetch('/api/jobfairs');
            const result = await res.json();
            if (result.code === 200 && result.data) {
                const container = document.getElementById('fairList');
                if (result.data.length === 0) {
                    container.innerHTML = '<p>暂无招聘会</p>';
                    return;
                }
                container.innerHTML = result.data.map(fair => `
                    <div class="fair-item">
                        <div>
                            <h4>${fair.title}</h4>
                            <p>时间：${fair.fair_time} | 地点：${fair.location}</p>
                            <p>${fair.content}</p>
                            <p>总摊位数：${fair.total_booths}</p>
                        </div>
                        <button class="btn btn-small" onclick="showBooths(${fair.fair_id}, '${fair.title}')">查看摊位并报名</button>
                    </div>
                `).join('');
            }
        }
        
        async function showBooths(fairId, title) {
            currentFairId = fairId;
            document.getElementById('selectedFairTitle').innerHTML = `${title} - 选择摊位`;
            document.getElementById('boothSelection').style.display = 'block';
            
            const res = await fetch(`/api/jobfairs/${fairId}/booths`);
            const result = await res.json();
            if (result.code === 200 && result.data) {
                const container = document.getElementById('boothGrid');
                container.innerHTML = result.data.map(booth => `
                    <div class="booth ${booth.is_occupied ? 'occupied' : 'available'}" 
                         onclick="${booth.is_occupied ? '' : `selectBooth(${booth.booth_id})`}">
                        ${booth.booth_no}<br>
                        ${booth.is_occupied ? '已占用' : '空闲'}
                    </div>
                `).join('');
            }
        }
        
        async function selectBooth(boothId) {
            if (confirm('确认选择这个摊位吗？')) {
                const res = await fetch('/api/employer/register_fair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fair_id: currentFairId, booth_id: boothId })
                });
                const result = await res.json();
                alert(result.message);
                if (result.code === 200) {
                    document.getElementById('boothSelection').style.display = 'none';
                    loadMyFairs();
                }
            }
        }
        
        document.getElementById('cancelBoothBtn')?.addEventListener('click', () => {
            document.getElementById('boothSelection').style.display = 'none';
        });
        
        // 数据统计
        async function loadStats() {
            const res = await fetch('/api/employer/stats');
            const result = await res.json();
            if (result.code === 200 && result.data) {
                const stats = result.data;
                const container = document.getElementById('statsGrid');
                container.innerHTML = `
                    <div class="stat-card"><h4>总投递数</h4><div class="stat-number">${stats.total}</div></div>
                    <div class="stat-card"><h4>已投递</h4><div class="stat-number">${stats['已投递']}</div></div>
                    <div class="stat-card"><h4>待查看</h4><div class="stat-number">${stats['待查看']}</div></div>
                    <div class="stat-card"><h4>面试</h4><div class="stat-number">${stats['面试']}</div></div>
                    <div class="stat-card"><h4>录用</h4><div class="stat-number">${stats['录用']}</div></div>
                    <div class="stat-card"><h4>不合适</h4><div class="stat-number">${stats['不合适']}</div></div>
                `;
            }
        }
        
        // 我的报名
        async function loadMyFairs() {
            const res = await fetch('/api/employer/my_fairs');
            const result = await res.json();
            if (result.code === 200 && result.data) {
                const container = document.getElementById('myFairsList');
                if (result.data.length === 0) {
                    container.innerHTML = '<p>暂未报名任何招聘会</p>';
                    return;
                }
                container.innerHTML = result.data.map(fair => `
                    <div class="fair-item">
                        <div>
                            <h4>${fair.title}</h4>
                            <p>时间：${fair.fair_time} | 地点：${fair.location}</p>
                            <p>已分配摊位：${fair.booth_no}</p>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        // 退出登录
        document.getElementById('logoutBtn').onclick = async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        };
        
        // 初始化
        getCurrentUser();
        loadMyJobs();
    </script>
</body>
</html>
