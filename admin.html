<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员后台 - 就业管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .header h2 { font-size: 20px; font-weight: 400; }
        .nav { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav a:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .nav a.active { background: rgba(255,255,255,0.2); color: #fff; }
        .container { max-width: 1400px; margin: 24px auto; padding: 0 24px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px 28px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card h3 { font-size: 18px; font-weight: 500; color: #1a1a2e; margin-bottom: 18px; border-bottom: 2px solid #f0f2f5; padding-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #333; }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-pass { background: #27ae60; color: white; }
        .btn-pass:hover { background: #219a52; }
        .btn-reject { background: #e74c3c; color: white; }
        .btn-reject:hover { background: #c0392b; }
        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5a6fd6; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .search-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .search-bar input, .search-bar select { padding: 10px 14px; border: 1.5px solid #dce0e6; border-radius: 8px; font-size: 14px; flex: 1; min-width: 180px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card h4 { font-weight: 400; font-size: 14px; opacity: 0.9; }
        .stat-number { font-size: 34px; font-weight: 700; margin: 8px 0; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .pagination button { padding: 6px 14px; border: 1px solid #dce0e6; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; }
        .pagination button.active-page { background: #667eea; color: #fff; border-color: #667eea; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 5px; color: #4a4a5a; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1.5px solid #dce0e6; border-radius: 8px; font-size: 14px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content { background: white; padding: 30px; border-radius: 14px; width: 520px; max-width: 92%; max-height: 85%; overflow-y: auto; }
        .booth-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 15px; }
        .booth { text-align: center; padding: 12px 6px; border: 1.5px solid #dce0e6; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .booth.available { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
        .booth.occupied { background: #ffebee; color: #c62828; border-color: #ef9a9a; cursor: not-allowed; }
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 14px 28px;
            border-radius: 10px;
            color: #fff;
            z-index: 9999;
            display: none;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
            animation: slideIn 0.35s ease;
        }
        .toast.success { background: #27ae60; }
        .toast.error { background: #e74c3c; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .page-content { display: none; }
        .page-content.active { display: block; }
        .text-center { text-align: center; color: #999; padding: 30px 0; }
        .gap-10 { display: flex; gap: 10px; flex-wrap: wrap; }
        .mt-12 { margin-top: 12px; }
        @media (max-width: 768px) {
            .header { padding: 12px 16px; }
            .header h2 { font-size: 16px; }
            .container { padding: 0 12px; }
            .card { padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <header class="header">
        <h2>📊 就业管理系统 · 管理员后台</h2>
        <nav class="nav" id="mainNav">
            <a class="active" data-page="dashboard">📈 数据看板</a>
            <a data-page="graduates">👨‍🎓 毕业生管理</a>
            <a data-page="employers">🏢 单位审核</a>
            <a data-page="recruitments">📋 招聘审核</a>
            <a data-page="jobfairs">📅 招聘会管理</a>
            <a data-page="booths">🪑 摊位分配</a>
            <a data-page="news">📰 发布资讯</a>
            <a id="logoutBtn" style="background:rgba(255,255,255,0.12);">🚪 退出</a>
        </nav>
    </header>

    <div class="container">

        <!-- ===== 页面1: 数据看板 ===== -->
        <div class="page-content active" id="page-dashboard">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="card"><h3>📊 各专业毕业生统计</h3><div id="majorStats"></div></div>
            <div class="card"><h3>🏢 用人单位类型分布</h3><div id="employerTypeStats"></div></div>
            <div class="card"><h3>📌 热门专业招聘需求 TOP 10</h3><div id="jobDemandStats"></div></div>
        </div>

        <!-- ===== 页面2: 毕业生管理 ===== -->
        <div class="page-content" id="page-graduates">
            <div class="card">
                <h3>👨‍🎓 毕业生信息管理</h3>
                <div class="search-bar">
                    <input type="text" id="searchGraduate" placeholder="🔍 搜索姓名 / 学号 / 专业">
                    <button class="btn btn-primary" id="searchGraduateBtn">搜索</button>
                </div>
                <div id="graduateTable"></div>
                <div class="pagination" id="graduatePagination"></div>
            </div>
        </div>

        <!-- ===== 页面3: 单位审核 ===== -->
        <div class="page-content" id="page-employers">
            <div class="card">
                <h3>🏢 用人单位审核</h3>
                <div id="employerTable"></div>
            </div>
        </div>

        <!-- ===== 页面4: 招聘审核 ===== -->
        <div class="page-content" id="page-recruitments">
            <div class="card">
                <h3>📋 招聘信息审核</h3>
                <div class="search-bar">
                    <select id="auditFilter">
                        <option value="">全部</option>
                        <option value="待审核">待审核</option>
                        <option value="已通过">已通过</option>
                        <option value="已下架">已下架</option>
                    </select>
                    <button class="btn btn-primary" id="filterRecruitmentsBtn">筛选</button>
                </div>
                <div id="recruitmentTable"></div>
            </div>
        </div>

        <!-- ===== 页面5: 招聘会管理 ===== -->
        <div class="page-content" id="page-jobfairs">
            <div class="card">
                <h3>📅 招聘会管理</h3>
                <button class="btn btn-primary" id="createFairBtn" style="margin-bottom:16px;">➕ 创建招聘会</button>
                <div id="fairTable"></div>
            </div>
        </div>

        <!-- ===== 页面6: 摊位分配 ===== -->
        <div class="page-content" id="page-booths">
            <div class="card">
                <h3>🪑 摊位分配管理</h3>
                <div class="search-bar">
                    <select id="fairSelect" style="flex:1;">
                        <option value="">请选择招聘会</option>
                    </select>
                    <button class="btn btn-primary" id="viewBoothsBtn">查看摊位</button>
                </div>
                <div id="boothGrid" class="booth-grid"></div>
            </div>
        </div>

        <!-- ===== 页面7: 发布资讯 ===== -->
        <div class="page-content" id="page-news">
            <div class="card">
                <h3>📰 发布就业资讯</h3>
                <form id="newsForm">
                    <div class="form-group"><label>标题</label><input type="text" id="newsTitle" required></div>
                    <div class="form-group"><label>类别</label>
                        <select id="newsCategory"><option>就业指导</option><option>就业政策</option></select>
                    </div>
                    <div class="form-group"><label>内容</label><textarea id="newsContent" rows="5" required></textarea></div>
                    <button type="submit" class="btn btn-primary">📤 发布</button>
                </form>
            </div>
            <div class="card">
                <h3>📋 已发布资讯</h3>
                <div id="newsList"></div>
            </div>
        </div>
    </div>

    <!-- ===== 模态框: 创建/编辑招聘会 ===== -->
    <div id="fairModal" class="modal">
        <div class="modal-content">
            <h3 id="fairModalTitle">📅 创建招聘会</h3>
            <form id="fairForm">
                <input type="hidden" id="fair_id">
                <div class="form-group"><label>标题 *</label><input type="text" id="fair_title" required></div>
                <div class="form-group"><label>时间 *</label><input type="datetime-local" id="fair_time" required></div>
                <div class="form-group"><label>地点 *</label><input type="text" id="fair_location" required></div>
                <div class="form-group"><label>内容</label><textarea id="fair_content" rows="3"></textarea></div>
                <div class="form-group"><label>总摊位数 *</label><input type="number" id="fair_booths" required min="1" value="30"></div>
                <div class="form-group"><label>发布状态</label>
                    <select id="fair_published"><option value="否">否</option><option value="是" selected>是</option></select>
                </div>
                <div class="gap-10" style="margin-top:16px;">
                    <button type="submit" class="btn btn-primary">💾 保存</button>
                    <button type="button" class="btn btn-danger" onclick="closeFairModal()">取消</button>
                </div>
                <div id="fairModalMsg" style="margin-top:12px;color:green;"></div>
            </form>
        </div>
    </div>

    <script>
        // ================================================================
        // 1. Toast 提示
        // ================================================================
        function showToast(msg, type) {
            type = type || 'success';
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            clearTimeout(t._timer);
            t._timer = setTimeout(function() {
                t.style.display = 'none';
            }, 3000);
        }

        function fetchAPI(url, options) {
            options = options || {};
            return fetch(url, options).then(function(res) {
                return res.json();
            });
        }

        // ================================================================
        // 2. 获取当前用户
        // ================================================================
        function getCurrentUser() {
            fetch('/api/current_user')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.code !== 200 || data.data.role !== 'admin') {
                        window.location.href = '/login.html';
                    }
                })
                .catch(function() {
                    window.location.href = '/login.html';
                });
        }

        // ================================================================
        // 3. 页面切换
        // ================================================================
        document.querySelectorAll('#mainNav a[data-page]').forEach(function(link) {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                var page = this.dataset.page;

                // 隐藏所有页面
                document.querySelectorAll('.page-content').forEach(function(el) {
                    el.classList.remove('active');
                });

                // 显示目标
                var target = document.getElementById('page-' + page);
                if (target) {
                    target.classList.add('active');
                }

                // 高亮导航
                document.querySelectorAll('#mainNav a').forEach(function(a) {
                    a.classList.remove('active');
                });
                this.classList.add('active');

                // 加载数据
                var loadMap = {
                    'dashboard': loadDashboard,
                    'graduates': loadGraduates,
                    'employers': loadEmployers,
                    'recruitments': loadRecruitments,
                    'jobfairs': loadFairs,
                    'booths': loadFairSelect,
                    'news': loadNewsList
                };
                if (loadMap[page]) {
                    loadMap[page]();
                }
            });
        });

        // ================================================================
        // 4. 数据看板
        // ================================================================
        function loadDashboard() {
            Promise.all([
                fetchAPI('/api/admin/stats/employment_rate'),
                fetchAPI('/api/admin/stats/graduate_by_major'),
                fetchAPI('/api/admin/stats/employer_by_type'),
                fetchAPI('/api/admin/stats/job_by_major')
            ]).then(function(results) {
                var rateRes = results[0];
                var majorRes = results[1];
                var typeRes = results[2];
                var demandRes = results[3];

                if (rateRes.code === 200) {
                    document.getElementById('statsGrid').innerHTML =
                        '<div class="stat-card"><h4>🎓 毕业生总数</h4><div class="stat-number">' + rateRes.data.total + '</div></div>' +
                        '<div class="stat-card"><h4>✅ 已录用人数</h4><div class="stat-number">' + rateRes.data.employed + '</div></div>' +
                        '<div class="stat-card"><h4>📈 就业率</h4><div class="stat-number">' + rateRes.data.rate + '%</div></div>';
                }

                var container = document.getElementById('majorStats');
                if (majorRes.code === 200 && majorRes.data.length > 0) {
                    var total = 0;
                    var html = '<table><tr><th>专业</th><th>人数</th></tr>';
                    for (var i = 0; i < majorRes.data.length; i++) {
                        total += majorRes.data[i].count;
                        html += '<tr><td>' + majorRes.data[i].major + '</td><td>' + majorRes.data[i].count + '</td></tr>';
                    }
                    html += '<tr style="font-weight:bold;background:#f8f9fa;"><td>总计</td><td>' + total + '</td></tr></table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p class="text-center">暂无数据</p>';
                }

                var container2 = document.getElementById('employerTypeStats');
                if (typeRes.code === 200 && typeRes.data.length > 0) {
                    var html2 = '<table><tr><th>单位类型</th><th>数量</th></tr>';
                    for (var j = 0; j < typeRes.data.length; j++) {
                        html2 += '<tr><td>' + (typeRes.data[j].nature || '未分类') + '</td><td>' + typeRes.data[j].count + '</td></tr>';
                    }
                    html2 += '</table>';
                    container2.innerHTML = html2;
                } else {
                    container2.innerHTML = '<p class="text-center">暂无数据</p>';
                }

                var container3 = document.getElementById('jobDemandStats');
                if (demandRes.code === 200 && demandRes.data.length > 0) {
                    var html3 = '<table><tr><th>专业</th><th>需求人数</th></tr>';
                    for (var k = 0; k < demandRes.data.length; k++) {
                        html3 += '<tr><td>' + (demandRes.data[k].major_needed || '不限') + '</td><td>' + demandRes.data[k].total_demand + '</td></tr>';
                    }
                    html3 += '</table>';
                    container3.innerHTML = html3;
                } else {
                    container3.innerHTML = '<p class="text-center">暂无数据</p>';
                }
            }).catch(function() {
                showToast('加载数据看板失败', 'error');
            });
        }

        // ================================================================
        // 5. 毕业生管理
        // ================================================================
        var graduatePage = 1;

        function loadGraduates() {
            var keyword = document.getElementById('searchGraduate').value || '';
            fetchAPI('/api/admin/graduates?page=' + graduatePage + '&keyword=' + encodeURIComponent(keyword))
                .then(function(res) {
                    if (res.code === 200) {
                        var container = document.getElementById('graduateTable');
                        if (res.data.length === 0) {
                            container.innerHTML = '<p class="text-center">暂无毕业生数据</p>';
                        } else {
                            var html = '<table><tr><th>学号</th><th>姓名</th><th>性别</th><th>专业</th><th>学院</th><th>电话</th></tr>';
                            for (var i = 0; i < res.data.length; i++) {
                                var g = res.data[i];
                                html += '<tr><td>' + g.stu_id + '</td><td>' + g.name + '</td><td>' + g.gender + '</td><td>' + g.major + '</td><td>' + (g.college || '-') + '</td><td>' + (g.phone || '-') + '</td></tr>';
                            }
                            html += '</table>';
                            container.innerHTML = html;
                        }
                        renderPagination(res.pagination, 'graduatePagination');
                    }
                });
        }

        document.getElementById('searchGraduateBtn').addEventListener('click', function() {
            graduatePage = 1;
            loadGraduates();
        });

        function renderPagination(pagination, containerId) {
            var container = document.getElementById(containerId);
            if (!pagination || pagination.pages <= 1) {
                container.innerHTML = '';
                return;
            }
            var html = '';
            for (var i = 1; i <= pagination.pages; i++) {
                var cls = (i === pagination.page) ? 'active-page' : '';
                html += '<button onclick="graduatePage=' + i + ';loadGraduates();" class="' + cls + '">' + i + '</button>';
            }
            container.innerHTML = html;
        }

        // ================================================================
        // 6. 单位审核
        // ================================================================
        function loadEmployers() {
            fetchAPI('/api/admin/employers').then(function(res) {
                if (res.code === 200) {
                    var container = document.getElementById('employerTable');
                    if (res.data.length === 0) {
                        container.innerHTML = '<p class="text-center">暂无用人单位</p>';
                    } else {
                        var html = '<table><tr><th>用户名</th><th>单位名称</th><th>地点</th><th>性质</th><th>审核状态</th><th>操作</th></tr>';
                        for (var i = 0; i < res.data.length; i++) {
                            var e = res.data[i];
                            var statusColor = (e.audit_status === '通过') ? 'green' : ((e.audit_status === '未通过') ? 'red' : 'orange');
                            var actions = '';
                            if (e.audit_status === '待审核') {
                                actions = '<button class="btn btn-pass btn-sm" onclick="auditEmployer(' + e.employer_id + ', \'通过\')">通过</button> <button class="btn btn-reject btn-sm" onclick="auditEmployer(' + e.employer_id + ', \'未通过\')">拒绝</button>';
                            } else {
                                actions = '-';
                            }
                            html += '<tr><td>' + e.username + '</td><td>' + e.name + '</td><td>' + (e.location || '-') + '</td><td>' + (e.nature || '-') + '</td><td><span style="color:' + statusColor + ';">' + e.audit_status + '</span></td><td>' + actions + '</td></tr>';
                        }
                        html += '</table>';
                        container.innerHTML = html;
                    }
                }
            });
        }

        function auditEmployer(employerId, status) {
            fetchAPI('/api/admin/employer/' + employerId + '/audit', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            }).then(function(res) {
                showToast(res.message, res.code === 200 ? 'success' : 'error');
                loadEmployers();
            });
        }

        // ================================================================
        // 7. 招聘信息审核
        // ================================================================
        function loadRecruitments() {
            var filter = document.getElementById('auditFilter').value;
            var url = filter ? '/api/admin/recruitments?status=' + filter : '/api/admin/recruitments';
            fetchAPI(url).then(function(res) {
                if (res.code === 200) {
                    var container = document.getElementById('recruitmentTable');
                    if (res.data.length === 0) {
                        container.innerHTML = '<p class="text-center">暂无招聘信息</p>';
                    } else {
                        var html = '<table><tr><th>单位</th><th>专业要求</th><th>学历</th><th>需求人数</th><th>状态</th><th>操作</th></tr>';
                        for (var i = 0; i < res.data.length; i++) {
                            var r = res.data[i];
                            var color = (r.audit_status === '已通过') ? 'green' : ((r.audit_status === '已下架') ? 'red' : 'orange');
                            var actions = '';
                            if (r.audit_status === '待审核') {
                                actions = '<button class="btn btn-pass btn-sm" onclick="auditRecruitment(' + r.rec_id + ', \'已通过\')">通过</button> <button class="btn btn-reject btn-sm" onclick="auditRecruitment(' + r.rec_id + ', \'已下架\')">下架</button>';
                            } else {
                                actions = '-';
                            }
                            html += '<tr><td>' + r.employer_name + '</td><td>' + r.major_needed + '</td><td>' + r.edu_required + '</td><td>' + r.demand_num + '</td><td><span style="color:' + color + ';">' + r.audit_status + '</span></td><td>' + actions + '</td></tr>';
                        }
                        html += '</table>';
                        container.innerHTML = html;
                    }
                }
            });
        }

        document.getElementById('filterRecruitmentsBtn').addEventListener('click', loadRecruitments);

        function auditRecruitment(recId, status) {
            fetchAPI('/api/admin/recruitment/' + recId + '/audit', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            }).then(function(res) {
                showToast(res.message, res.code === 200 ? 'success' : 'error');
                loadRecruitments();
            });
        }

        // ================================================================
        // 8. 招聘会管理
        // ================================================================
        function loadFairs() {
            fetchAPI('/api/admin/jobfairs').then(function(res) {
                if (res.code === 200) {
                    var container = document.getElementById('fairTable');
                    if (res.data.length === 0) {
                        container.innerHTML = '<p class="text-center">暂无招聘会</p>';
                    } else {
                        var html = '<table><tr><th>标题</th><th>时间</th><th>地点</th><th>摊位数</th><th>状态</th><th>操作</th></tr>';
                        for (var i = 0; i < res.data.length; i++) {
                            var f = res.data[i];
                            html += '<tr><td>' + f.title + '</td><td>' + f.fair_time + '</td><td>' + f.location + '</td><td>' + f.total_booths + '</td><td><span style="color:' + (f.is_published === '是' ? 'green' : 'orange') + ';">' + f.is_published + '</span></td><td><button class="btn btn-primary btn-sm" onclick="editFair(' + f.fair_id + ')">编辑</button> <button class="btn btn-danger btn-sm" onclick="deleteFair(' + f.fair_id + ')">删除</button></td></tr>';
                        }
                        html += '</table>';
                        container.innerHTML = html;
                    }
                }
            });
        }

        function showAddFairModal() {
            document.getElementById('fairModalTitle').innerText = '📅 创建招聘会';
            document.getElementById('fairForm').reset();
            document.getElementById('fair_id').value = '';
            document.getElementById('fair_booths').value = 30;
            document.getElementById('fair_published').value = '是';
            document.getElementById('fairModalMsg').textContent = '';
            document.getElementById('fairModal').style.display = 'flex';
        }

        function closeFairModal() {
            document.getElementById('fairModal').style.display = 'none';
        }

        function editFair(fairId) {
            fetchAPI('/api/admin/jobfairs').then(function(res) {
                if (res.code === 200) {
                    var fair = null;
                    for (var i = 0; i < res.data.length; i++) {
                        if (res.data[i].fair_id === fairId) {
                            fair = res.data[i];
                            break;
                        }
                    }
                    if (fair) {
                        document.getElementById('fairModalTitle').innerText = '📝 编辑招聘会';
                        document.getElementById('fair_id').value = fair.fair_id;
                        document.getElementById('fair_title').value = fair.title;
                        document.getElementById('fair_time').value = fair.fair_time.replace(' ', 'T').slice(0, 16);
                        document.getElementById('fair_location').value = fair.location;
                        document.getElementById('fair_content').value = fair.content || '';
                        document.getElementById('fair_booths').value = fair.total_booths;
                        document.getElementById('fair_published').value = fair.is_published;
                        document.getElementById('fairModalMsg').textContent = '';
                        document.getElementById('fairModal').style.display = 'flex';
                    }
                }
            });
        }

        function deleteFair(fairId) {
            if (confirm('确定要删除这个招聘会吗？')) {
                fetchAPI('/api/admin/jobfairs/' + fairId, { method: 'DELETE' }).then(function(res) {
                    showToast(res.message, res.code === 200 ? 'success' : 'error');
                    loadFairs();
                });
            }
        }

        document.getElementById('createFairBtn').addEventListener('click', showAddFairModal);

        document.getElementById('fairForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var fairId = document.getElementById('fair_id').value;
            var formData = {
                title: document.getElementById('fair_title').value.trim(),
                fair_time: document.getElementById('fair_time').value,
                location: document.getElementById('fair_location').value.trim(),
                content: document.getElementById('fair_content').value.trim(),
                total_booths: parseInt(document.getElementById('fair_booths').value) || 0,
                is_published: document.getElementById('fair_published').value
            };

            if (!formData.title || !formData.fair_time || !formData.location) {
                document.getElementById('fairModalMsg').innerHTML = '<span style="color:red;">请填写完整信息</span>';
                return;
            }
            if (formData.total_booths < 1) {
                document.getElementById('fairModalMsg').innerHTML = '<span style="color:red;">摊位数至少为1</span>';
                return;
            }

            var url = fairId ? '/api/admin/jobfairs/' + fairId : '/api/admin/jobfairs';
            var method = fairId ? 'PUT' : 'POST';
            fetchAPI(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            }).then(function(res) {
                document.getElementById('fairModalMsg').innerHTML = res.code === 200 ?
                    '<span style="color:green;">✅ ' + res.message + '</span>' :
                    '<span style="color:red;">❌ ' + res.message + '</span>';
                if (res.code === 200) {
                    showToast(res.message, 'success');
                    setTimeout(function() {
                        closeFairModal();
                        loadFairs();
                    }, 600);
                } else {
                    showToast(res.message, 'error');
                }
            });
        });

        // ================================================================
        // 9. 摊位分配
        // ================================================================
        function loadFairSelect() {
            fetchAPI('/api/admin/jobfairs').then(function(res) {
                if (res.code === 200) {
                    var select = document.getElementById('fairSelect');
                    var html = '<option value="">请选择招聘会</option>';
                    for (var i = 0; i < res.data.length; i++) {
                        html += '<option value="' + res.data[i].fair_id + '">' + res.data[i].title + '</option>';
                    }
                    select.innerHTML = html;
                }
            });
        }

        document.getElementById('viewBoothsBtn').addEventListener('click', function() {
            var fairId = document.getElementById('fairSelect').value;
            if (!fairId) {
                showToast('请先选择招聘会', 'error');
                return;
            }
            fetchAPI('/api/admin/fairs/' + fairId + '/booths').then(function(res) {
                if (res.code === 200) {
                    var container = document.getElementById('boothGrid');
                    if (res.data.length === 0) {
                        container.innerHTML = '<p class="text-center">该招聘会暂无摊位</p>';
                    } else {
                        var html = '';
                        for (var i = 0; i < res.data.length; i++) {
                            var b = res.data[i];
                            var cls = b.is_occupied ? 'occupied' : 'available';
                            var label = b.is_occupied ? (b.employer_name || '已占用') : '空闲';
                            html += '<div class="booth ' + cls + '" onclick="assignBooth(' + b.booth_id + ', ' + b.is_occupied + ')">' + b.booth_no + '<br>' + label + '</div>';
                        }
                        container.innerHTML = html;
                    }
                }
            });
        });

        function assignBooth(boothId, isOccupied) {
            if (isOccupied) {
                if (confirm('确定要清空这个摊位吗？')) {
                    fetchAPI('/api/admin/booths/' + boothId + '/assign', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ employer_id: null })
                    }).then(function(res) {
                        showToast(res.message, res.code === 200 ? 'success' : 'error');
                        if (res.code === 200) {
                            document.getElementById('viewBoothsBtn').click();
                        }
                    });
                }
            } else {
                fetchAPI('/api/admin/all_employers').then(function(empRes) {
                    if (empRes.code === 200 && empRes.data.length > 0) {
                        var list = '';
                        for (var i = 0; i < empRes.data.length; i++) {
                            list += empRes.data[i].employer_id + ':' + empRes.data[i].name + '\n';
                        }
                        var employerId = prompt('请输入用人单位ID:\n' + list);
                        if (employerId && !isNaN(employerId)) {
                            fetchAPI('/api/admin/booths/' + boothId + '/assign', {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ employer_id: parseInt(employerId) })
                            }).then(function(res) {
                                showToast(res.message, res.code === 200 ? 'success' : 'error');
                                if (res.code === 200) {
                                    document.getElementById('viewBoothsBtn').click();
                                }
                            });
                        }
                    } else {
                        showToast('暂无可分配的用人单位', 'error');
                    }
                });
            }
        }

        // ================================================================
        // 10. 发布资讯
        // ================================================================
        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = {
                title: document.getElementById('newsTitle').value.trim(),
                category: document.getElementById('newsCategory').value,
                content: document.getElementById('newsContent').value.trim()
            };
            if (!data.title || !data.content) {
                showToast('标题和内容不能为空', 'error');
                return;
            }
            fetchAPI('/api/admin/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(function(res) {
                showToast(res.message, res.code === 200 ? 'success' : 'error');
                if (res.code === 200) {
                    document.getElementById('newsForm').reset();
                    loadNewsList();
                }
            });
        });

        function loadNewsList() {
            fetchAPI('/api/news').then(function(res) {
                if (res.code === 200 && res.data) {
                    var container = document.getElementById('newsList');
                    if (res.data.length === 0) {
                        container.innerHTML = '<p class="text-center">暂无资讯</p>';
                    } else {
                        var html = '';
                        for (var i = 0; i < res.data.length; i++) {
                            var n = res.data[i];
                            html += '<div style="border-bottom:1px solid #eee;padding:14px 0;"><h4 style="font-size:16px;color:#1a1a2e;">' + n.title + '</h4><p style="font-size:13px;color:#999;">' + n.category + ' | ' + n.publish_time + ' | 发布人：' + (n.publisher || '就业办') + '</p><p style="font-size:14px;color:#4a4a5a;margin-top:6px;line-height:1.6;">' + n.content + '</p></div>';
                        }
                        container.innerHTML = html;
                    }
                }
            });
        }

        // ================================================================
        // 11. 退出登录
        // ================================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            fetch('/api/logout', { method: 'POST' }).then(function() {
                window.location.href = '/login.html';
            });
        });

        // ================================================================
        // 12. 初始化
        // ================================================================
        getCurrentUser();
        loadDashboard();
    </script>
</body>
</html>
